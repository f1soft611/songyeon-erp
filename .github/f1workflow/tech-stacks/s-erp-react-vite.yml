name: 'SONGYEON ERP React Frontend'
language: 'TypeScript'
framework: 'React 18 (Vite)'
ui_library: 'MUI (Material UI) + F1-Grid'
test_framework: 'Vitest + Playwright'
build_system: 'npm'

paths:
  source: 'frontend/src'
  tests: 'frontend/tests'
  scripts: 'frontend/scripts'
  docs_result: 'docs/result'

commands:
  install: 'cd frontend && npm install'
  build: 'npm run build'
  test_all: 'npm run test'
  test_single: 'npm run test -- {test_file}'
  dev_server: 'npm run dev'

rules:
  - 'MUI TextField 사용 시 셀 내 정렬 비틀림 방지를 위해 margin="none" 명시'
  - '1초 카운트다운/타이머 state는 최상위에 두지 않고 SessionCountdownLabel 등 리프 컴포넌트로 독립 분리'
  - '와일드카드 라우팅(/dashboard/*) 딥링크 진입 시 Playwright에서 UI 클릭 이동 동작 모사'
  - 'Playwright 스크린샷 저장 경로는 영문 소문자, 숫자, 하이픈만 사용 (docs/result/YYYYMMDD/<work-slug>/screenshots/*.png)'
